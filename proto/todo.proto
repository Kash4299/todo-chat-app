syntax = "proto3";

package todo;

option go_package = "todo/proto/todopb";

// ─── Todo Service ────────────────────────────────────────────────

service TodoService {
  rpc GetAllTodos (GetAllTodosRequest) returns (GetAllTodosResponse);
  rpc CreateTodo (CreateTodoRequest) returns (CreateTodoResponse);
}

// ─── Messages ────────────────────────────────────────────────────

message TodoItem {
  string id          = 1;
  string title       = 2;
  string status      = 3;  // backlog, todo, in_progress, testing, done
  int32  priority    = 4;  // 0=normal, 1=medium, 2=high, 3=urgent
  string description = 5;
  string created_by  = 6;
  string assigned    = 7;
  string created_at  = 8;
  string updated_at  = 9;
}

message GetAllTodosRequest {}

message GetAllTodosResponse {
  repeated TodoItem todos = 1;
}

message CreateTodoRequest {
  string title       = 1;
  string status      = 2;
  int32  priority    = 3;
  string description = 4;
  string assigned    = 5;
}

message CreateTodoResponse {
  string message = 1;
}
