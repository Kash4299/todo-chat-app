services:
  app:
    build: .
    restart: unless-stopped
    # Loopback only — public traffic enters through Caddy (TLS) on 80/443.
    # Local dev can still reach the app directly at http://127.0.0.1:8080.
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - GIN_MODE=${GIN_MODE:-release}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_DATABASE=${DB_DATABASE:-todo_chat_app}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-50}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-10}
      - DB_CONN_MAX_LIFETIME_SECONDS=${DB_CONN_MAX_LIFETIME_SECONDS:-1800}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ACCESS_EXPIRY_MIN=${JWT_ACCESS_EXPIRY_MIN:-15}
      - JWT_REFRESH_EXPIRY_DAY=${JWT_REFRESH_EXPIRY_DAY:-7}
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-smtp}
      - APP_BASE_URL=${APP_BASE_URL:?APP_BASE_URL is required}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST is required for production SMTP}
      - SMTP_PORT=${SMTP_PORT:?SMTP_PORT is required for production SMTP}
      - SMTP_USER=${SMTP_USER:?SMTP_USER is required for production SMTP}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD is required for production SMTP}
      - SMTP_FROM=${SMTP_FROM:?SMTP_FROM is required for production SMTP}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # Auth0 is being removed (T80); leaving these unset keeps the Auth0
      # verification path disabled.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT:-8080}/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks:
      - todo-network
    command: >
      sh -c "./migrate && ./main"

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_DB=${DB_DATABASE:-todo_chat_app}
    # Loopback only: reachable from the host (SSH tunnel / local psql) but never
    # from the internet. Docker would otherwise publish to 0.0.0.0 and bypass
    # ufw. The app reaches Postgres internally via the todo-network DNS name.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - todo-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only — Redis has no auth by default; must never face the internet.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - todo-network

  ui:
    # Next.js frontend. Cloned as a sibling repo on the host (see DEPLOY.md).
    build: ../todo-chat-app-ui
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - NODE_ENV=production
      # Server-side BFF reaches the backend over the internal network — the
      # Go backend is never exposed publicly. Read at runtime via dynamic
      # process.env access, so these override the build-time defaults.
      - NEXT_PUBLIC_API_URL=http://app:8080/api
      - NEXT_PUBLIC_WS_URL=ws://app:8080/api/v1/ws
    networks:
      - todo-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - ui
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN is required (e.g. app.example.com; use localhost for local dev)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - todo-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  todo-network:
    driver: bridge
